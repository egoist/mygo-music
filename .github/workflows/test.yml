# Runs the tests on every push to main and every pull request, on Linux and
# on macOS, since some tests, like the notch's, only run on macOS and skip
# elsewhere.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older one.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Per job, like the Release workflow's, falling back to the job's last
      # cache when go.mod or go.sum changes.
      - name: Find Go's caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: test-go-${{ matrix.name }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: test-go-${{ matrix.name }}-
      - name: Build
        run: go build -o /dev/null .
      - name: Test
        run: go test ./internal/...
